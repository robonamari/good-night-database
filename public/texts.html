  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: 1.5rem auto;
      padding: 1.4rem;
      font-size: 1.2rem;
      line-height: 2;
      max-width: 600px;
      border-radius: 22px;
      box-shadow: 0 0 18px #00ffff55, 0 0 35px #ff00ff44;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      color: #ffffffdd;
      position: relative;
      overflow: hidden
    }

    .card:hover {
      transform: scale(1.04);
      box-shadow: 0 0 40px #00ffffaa, 0 0 50px #ff00ffaa
    }

    .card:active {
      transform: scale(0.97)
    }

    .card::before {
      content: "✦";
      position: absolute;
      top: -15px;
      left: -15px;
      font-size: 2rem;
      color: #00eaff;
      opacity: 0.4;
      animation: pulseNeon 3s infinite ease-in-out
    }

    .card::after {
      content: "✧";
      position: absolute;
      bottom: -15px;
      right: -15px;
      font-size: 1.8rem;
      color: #ff00ff;
      opacity: 0.4;
      animation: pulseNeon 4s infinite ease-in-out
    }

    @keyframes pulseNeon {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.4
      }

      50% {
        transform: scale(1.5);
        opacity: 1
      }
    }

    @media (max-width: 480px) {
      .notice {
        font-size: 0.95rem;
        padding: 0.7rem 1rem
      }

      .card {
        font-size: 1.05rem;
        padding: 1rem
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="notice">برای کپی متن، روی متن کلیک کنید.</div>
  </div>
  <script>
    const loadTexts = async () => {
      try {
        const response = await fetch("database.json");
        const {
          texts
        } = await response.json();
        const container = document.querySelector(".container");
        const fragment = document.createDocumentFragment();
        texts.forEach(text => {
          const card = document.createElement("div");
          card.className = "card";
          card.textContent = text;
          card.onclick = () =>
            navigator.clipboard.writeText(text)
              .then(() => showNotification("متن کپی شد!"))
              .catch(() => showNotification("کپی نشد!"));
          fragment.appendChild(card);
        });
        container.appendChild(fragment);
      } catch (error) {
        console.error(error);
        showNotification("خطا در بارگذاری متن‌ها");
      }
    };
    loadTexts();
  </script>
  <script src="assets/js/notification.js" defer></script>
</body>

</html>
