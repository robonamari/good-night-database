<!DOCTYPE html>
<html dir="rtl" lang="fa">

<head>
  <meta charset="UTF-8">
  <title>گیف شب بخیر | Night Melodies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="title" content="گیف شب بخیر">
  <meta name="description"
    content="گیف‌های زیبای شب بخیر را ببین، دانلود کن یا لینک آن‌ها را برای ارسال به عزیزانت کپی کن.">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#6a00ff">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://good-night-database.robonamari.ir/gifs">
  <meta property="og:title" content="گیف شب بخیر">
  <meta property="og:description"
    content="گیف‌های زیبای شب بخیر را ببین، دانلود کن یا لینک آن‌ها را برای ارسال به عزیزانت کپی کن.">
  <meta property="og:image" content="https://good-night-database.robonamari.ir/favicon.ico">
  <meta property="og:site_name" content="Night Melodies">
  <link rel="canonical" href="https://good-night-database.robonamari.ir/gifs">
  <link rel="icon" href="https://good-night-database.robonamari.ir/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    .notice {
      background: linear-gradient(to right, #00eaff, #ff00f7);
      color: #12001f;
      padding: 1rem 1.5rem;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 16px;
      margin: 1.5rem auto;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 0 25px #ff00f7aa, 0 0 12px #00eaff99;
    }

    .gif-card {
      margin: 1.5rem auto;
      padding: 1rem;
      max-width: 400px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .gif-card img {
      max-width: 100%;
      border-radius: 12px
    }

    @media (max-width: 480px) {
      .notice {
        font-size: 0.95rem;
        padding: 0.7rem 1rem
      }

      .gif-card {
        max-width: 90%;
        margin: 1rem auto
      }
    }

    #modal {
      background: #1a0033;
      padding: 20px;
      border: none;
      border-radius: 15px;
      max-width: 320px;
      text-align: center;
      color: #e0e0ff;
      direction: rtl
    }

    #modal::backdrop {
      background: rgba(0, 0, 0, 0.7)
    }

    #modal p {
      margin-bottom: 20px
    }

    #modal button,
    #modal a {
      margin: 0 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      text-decoration: none;
    }

    #downloadBtn {
      background-color: #00ffff;
      color: #12001f
    }

    #copyBtn {
      background-color: #ff00ff;
      color: #12001f
    }

    #closeModal {
      margin-top: 15px;
      background: none;
      border: none;
      color: #e0e0ff;
      cursor: pointer;
      font-size: 0.9rem
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="notice">برای دانلود یا دریافت لینک، روی GIF کلیک کنید.</div>
  </div>
  <dialog id="modal">
    <p>چه کاری می‌خواهید انجام دهید؟</p>
    <a id="downloadBtn" download>دانلود</a>
    <button id="copyBtn" onclick="copyGIF()">کپی لینک</button>
    <br>
    <button id="closeModal" onclick="modal.close()">انصراف</button>
  </dialog>
  <script>
    const modal = document.getElementById("modal");
    const showModal = (url) => {
      modal.dataset.gifUrl = url;
      document.getElementById("downloadBtn").href = url;
      modal.showModal();
    };
    const copyGIF = async () => {
      modal.close();
      try {
        await navigator.clipboard.writeText(modal.dataset.gifUrl);
        showNotification("لینک کپی شد!");
      } catch {
        showNotification("کپی نشد!");
      }
    };
    const loadGIFs = async () => {
      try {
        const {
          gifs
        } = await (await fetch("database.json")).json();
        const container = document.querySelector(".container");
        const fragment = document.createDocumentFragment();
        gifs.forEach((url, index) => {
          const card = document.createElement("div");
          const img = document.createElement("img");
          card.className = "gif-card";
          img.src = url;
          img.alt = "";
          if (index === 0) {
            img.loading = "eager";
            img.decoding = "async";
            img.fetchPriority = "high";
          } else {
            img.loading = "lazy";
          }
          card.onclick = () => showModal(url);
          card.appendChild(img);
          fragment.appendChild(card);
        });
        container.appendChild(fragment);
      } catch (error) {
        console.error(error);
        showNotification("خطا در بارگذاری گیف‌ها");
      }
    };
    loadGIFs();
  </script>
  <script src="assets/js/notification.js" defer></script>
</body>

</html>
