<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta property="og:description"
    content="گلچینی از گیف‌های زیبا و آرامش‌بخش شبانه برای استفاده در استوری، کپشن و اشتراک‌گذاری. لینک هر گیف با یک کلیک کپی می‌شود تا راحت‌تر استفاده کنید.">
  <meta property="og:image" content="https://good-night-database.robonamari.com/favicon.ico">

  <link rel="icon" href="https://good-night-database.robonamari.com/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    .gif-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: 1.5rem auto;
      padding: 1rem;
      max-width: 400px;
      border-radius: 18px;
      box-shadow: 0 0 18px #00ffff55, 0 0 25px #ff00ff44;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .gif-card:hover {
      transform: scale(1.04);
      box-shadow: 0 0 35px #00ffffaa, 0 0 40px #ff00ffaa
    }

    .gif-card img {
      max-width: 100%;
      border-radius: 12px
    }

    @media (max-width: 480px) {
      .notice {
        font-size: 0.95rem;
        padding: 0.7rem 1rem
      }

      .gif-card {
        max-width: 90%;
        margin: 1rem auto
      }
    }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 10000;
      direction: rtl
    }

    #modalContent {
      background: #1a0033;
      padding: 20px;
      border-radius: 15px;
      max-width: 320px;
      text-align: center;
      color: #e0e0ff;
      font-family: Shabnam
    }

    #modalContent p {
      margin-bottom: 20px
    }

    #modalContent button {
      margin: 0 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-family: Shabnam;
      font-size: 1rem
    }

    #downloadBtn {
      background-color: #00ffff;
      color: #12001f
    }

    #copyBtn {
      background-color: #ff00ff;
      color: #12001f
    }

    #closeModal {
      margin-top: 15px;
      background: none;
      border: none;
      color: #e0e0ff;
      cursor: pointer;
      font-size: 0.9rem
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="notice">برای دانلود یا دریافت لینک، روی GIF کلیک کنید.</div>
  </div>
  <div id="modal">
    <div id="modalContent">
      <p>چه کاری می‌خواهید انجام دهید؟</p>
      <button id="downloadBtn">دانلود</button>
      <button id="copyBtn">کپی لینک</button>
      <br>
      <button id="closeModal">انصراف</button>
    </div>
  </div>
  <script>
    let currentGifUrl = null;
    const showModal = url => {
      currentGifUrl = url;
      document.getElementById("modal").style.display = "flex";
    };
    const hideModal = () => {
      document.getElementById("modal").style.display = "none";
      currentGifUrl = null;
    };
    const copyGIF = async url => {
      try {
        await navigator.clipboard.writeText(url);
        showNotification("لینک کپی شد!");
      } catch {
        showNotification("کپی نشد!");
      }
    };
    const downloadGIF = url => {
      const link = document.createElement("a");
      link.href = url;
      link.download = url.split("/").pop();
      document.body.append(link);
      link.click();
      link.remove();
      showNotification("دانلود آغاز شد!");
    };
    const loadGIFs = async () => {
      try {
        const {
          gifs
        } = await (await fetch("database.json")).json();
        const container = document.querySelector(".container");
        const fragment = document.createDocumentFragment();
        gifs.forEach((url, index) => {
          const card = document.createElement("div");
          const img = document.createElement("img");
          card.className = "gif-card";
          img.src = url;
          img.alt = "GIF";
          if (index === 0) {
            img.loading = "eager";
            img.decoding = "async";
            img.fetchPriority = "high";
          } else {
            img.loading = "lazy";
          }
          card.onclick = () => showModal(url);
          card.appendChild(img);
          fragment.appendChild(card);
        });
        container.appendChild(fragment);
      } catch (error) {
        console.error(error);
        showNotification("خطا در بارگذاری گیف‌ها");
      }
    };
    document.getElementById("closeModal").onclick = hideModal;
    document.getElementById("copyBtn").onclick = () => {
      if (currentGifUrl) copyGIF(currentGifUrl);
      hideModal();
    };
    document.getElementById("downloadBtn").onclick = () => {
      if (currentGifUrl) downloadGIF(currentGifUrl);
      hideModal();
    };
    loadGIFs();
  </script>
  <script src="assets/js/notification.js" defer></script>
</body>

</html>
